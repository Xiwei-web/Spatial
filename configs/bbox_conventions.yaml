robobrain2_0:
  applies_to:
  - RoboBrain2.0-7B
  found: true
  prompt_template: 'Please provide the bounding box coordinate of the region this sentence describes: {object}.'
  output_format: '[x1, y1, x2, y2] plain text; official regex r''\[\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\]''. With thinking enabled the raw reply contains
    a ''<think>...</think>'' section before the answer; the official wrapper strips the think/answer tags and returns e.g. ''[0, 193, 226, 640]''.'
  convention: abs_model_xyxy   # 2026-11-26 由 abs_orig_xyxy 改为 abs_model_xyxy：dev 标定（manifests/bbox_calib_RoboBrain2.0-7B.json；规则判“未定”，planner 裁定，见 reports/round_4.md）
  notes: 'IMPORTANT version trap: the repo main branch is now RoboBrain 2.5, whose inference.py rescales by /1000 (''coords are relative (0~1000)''). For RoboBrain
    2.0 use the 2.0-era inference.py (commit a4f9450, 2025-08-03): it parses integers and draws them DIRECTLY on the cv2-loaded original image with no rescaling,
    i.e. absolute pixels treated as original-image coordinates (README example answer ''[0, 193, 226, 640]''). No doc sentence states original-vs-resized explicitly;
    the model is Qwen2.5-VL-based (qwen_vl_utils.process_vision_info), so if smart_resize changes the image size the true frame may be the resized input - check empirically
    / keep images within pixel limits. Thinking: enable_thinking appends ''<think>'' to the user text; disabled-but-supported (7B/32B) appends ''<think></think><answer>''.
    Other 2.0 task templates (verbatim): pointing: ''{text}. Your answer should be formatted as a list of tuples, i.e. [(x1, y1), (x2, y2), ...], where each tuple
    contains the x and y coordinates of a point satisfying the conditions above. The coordinates should indicate the normalized pixel locations of the points in the
    image.''; affordance: ''You are a robot using the joint control. The task is "{text}". Please predict a possible affordance area of the end effector.'' (output
    parsed as a box); trajectory: ''You are a robot using the joint control. The task is "{text}". Please predict up to 10 key trajectory points to complete the task.
    Your answer should be formatted as a list of tuples, i.e. [[x1, y1], [x2, y2], ...], where each tuple contains the x and y coordinates of a point.'' The HF card
    BAAI/RoboBrain2.0-7B is access-restricted (gated) and could not be read.'
  sources:
  - url: https://github.com/FlagOpen/RoboBrain2.0/blob/a4f9450e1a62a1b6ca855451ce8d5472535f9930/inference.py
    quote: 'text = f"Please provide the bounding box coordinate of the region this sentence describes: {text}."'
  - url: https://github.com/FlagOpen/RoboBrain2.0/blob/a4f9450e1a62a1b6ca855451ce8d5472535f9930/inference.py
    quote: box_pattern = r'\[\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\]'  ...  plot_boxes = [[int(x1), int(y1), int(x2), int(y2)] for x1, y1, x2, y2 in boxes]
  - url: https://github.com/FlagOpen/RoboBrain2.0/blob/a4f9450e1a62a1b6ca855451ce8d5472535f9930/inference.py
    quote: 'image = cv2.imread(image_path) ... for box in boxes: x1, y1, x2, y2 = box; cv2.rectangle(image, (x1, y1), (x2, y2), (0, 255, 0), 2)'
  - url: https://github.com/FlagOpen/RoboBrain2.0/blob/a4f9450e1a62a1b6ca855451ce8d5472535f9930/inference.py
    quote: 'if enable_thinking: text = f"{text}<think>"  elif self.supports_thinking: text = f"{text}<think></think><answer>"'
  - url: https://github.com/FlagOpen/RoboBrain2.0/blob/a4f9450e1a62a1b6ca855451ce8d5472535f9930/README.md
    quote: 'pred = model.inference(prompt, image, task="grounding", plot=True, enable_thinking=True, do_sample=True) ... ''answer'': ''[0, 193, 226, 640]'''
  - url: https://github.com/FlagOpen/RoboBrain2.0/blob/main/inference.py
    quote: 'boxes: List of boxes in format [[x1, y1, x2, y2], ...] where coords are relative (0~1000)  (RoboBrain 2.5 code on main - NOT the 2.0 convention)'
vst:
  applies_to:
  - VST-7B-RL
  found: false
  prompt_template: ''
  output_format: ''
  convention: unknown
  notes: 'No official 2D bounding-box/grounding prompt or 2D coordinate convention found. Checked: HF card rayruiyang/VST-7B-RL (spatial QA quickstart only), GitHub
    Yangr116/VST README (master) and both cookbooks (scene_understanding.ipynb = spatial QA; object_detection_3d.ipynb = 3D boxes only), and the paper arXiv:2511.05491
    (HTML). What exists officially: (a) 3D detection prompt ending ''Output a json list where each entry contains the object name in "label" and its 3D bounding box
    in "bbox_3d"'' + ''Detect the 3D bounding boxes of {object}'' with format [x_center, y_center, z_center, x_size, y_size, z_size, pitch, yaw, roll] (metres; angles
    normalized by 180 deg); (b) a paper training-data example whose ANSWER uses Qwen-style 2D JSON ''{"bbox_2d":[324,81,477,475],"label":"person"}'', but the normalization/reference
    frame is not stated. Model class is Qwen2_5_VLForConditionalGeneration (processor min_pixels=256*28*28, max_pixels=1280*28*28), so Qwen2.5-VL''s abs_model_xyxy/bbox_2d
    convention is the natural hypothesis - undocumented, verify empirically. Thinking system prompt (official): ''You are a helpful assistant. You should first think
    about the reasoning process in the mind and then provide the user with the answer. The reasoning process is enclosed within <think> </think> tags, i.e. <think>
    reasoning process here </think> answer here.'''
  sources:
