# Official bounding-box (2D grounding) prompt + output-coordinate conventions per VLM family.
# Compiled 2026-11-25 from official sources only (HF cards, vendor GitHub repos/cookbooks, vendor docs, papers).
# Every entry carries source URLs with verbatim quotes. `found: false` = no official convention located
# (see notes for what was checked and any untested hypothesis). Entries whose notes start with CAVEAT are
# inherited/inferred from a sibling generation's official source rather than stated for that exact model.
#
# convention enum:
#   norm1000_xyxy  - [x1,y1,x2,y2], each scaled to 0..1000 of ORIGINAL image width/height
#   norm1000_yxyx  - [y1,x1,y2,x2], each scaled to 0..1000 of ORIGINAL image height/width
#   norm1_xyxy     - [x1,y1,x2,y2] floats in 0..1 (LLaVA-1.5: of the PADDED-TO-SQUARE image, see notes)
#   abs_model_xyxy - absolute pixels on the model's RESIZED input image (rescale to original yourself)
#   abs_orig_xyxy  - absolute pixels on the original image
#   range_norm1_else_norm1000 - per output: all four numbers <= 1 -> norm1_xyxy, otherwise norm1000_xyxy (dev-calibrated, SenseNova-SI-1.2/1.3)
#   unknown        - not documented
#
# 2026-11-26: the `calibrated` block at the end holds the dev-calibrated (prompt, convention) per model (reports/round_3.md, round_4.md);
# family entries above keep the official prompt/convention as documented (only RoboBrain2.0's convention was changed, see its comment).
# prompt_template uses {object} as the placeholder for the referring phrase / object name.
qwen2_5_vl:
  applies_to:
  - Qwen2.5-VL-7B-Instruct
  found: true
  prompt_template: Locate {object}, output its bbox coordinates using JSON format.
  output_format: '```json [{"bbox_2d": [x1, y1, x2, y2], "label": "..."}] ``` (JSON list inside a markdown fence)'
  convention: abs_model_xyxy
  notes: 'Absolute pixel coordinates on the RESIZED model-input image (smart_resize output; input_height/width = image_grid_thw*14), order x1,y1,x2,y2, origin top-left.
    Rescale to the original with x/input_width*orig_w, y/input_height*orig_h. Default system prompt in the cookbook is ''You are a helpful assistant''. The cookbook
    lives at an old commit of the repo (the repo was renamed Qwen2.5-VL -> Qwen3-VL and main now holds the Qwen3-VL version of the notebook). Verbatim cookbook wording
    is ''Locate the top right brown cake, output its bbox coordinates using JSON format.''; {object} substituted for the referring phrase. Other official variants:
    ''Outline the position of each small cake and output all the coordinates in JSON format.''; ''Locate the shadow of the paper fox, report the bbox coordinates
    in JSON format.'''
  sources:
  - url: https://github.com/QwenLM/Qwen3-VL/blob/f61c3cdcffac3aa3dba0bde01c9763b87db0dccb/cookbooks/spatial_understanding.ipynb
    quote: prompt = "Locate the top right brown cake, output its bbox coordinates using JSON format."
  - url: https://github.com/QwenLM/Qwen3-VL/blob/f61c3cdcffac3aa3dba0bde01c9763b87db0dccb/cookbooks/spatial_understanding.ipynb
    quote: abs_x1 = int(bounding_box["bbox_2d"][0]/input_width * width)  /  abs_y1 = int(bounding_box["bbox_2d"][1]/input_height * height)
  - url: https://github.com/QwenLM/Qwen3-VL/blob/f61c3cdcffac3aa3dba0bde01c9763b87db0dccb/cookbooks/spatial_understanding.ipynb
    quote: input_height = inputs['image_grid_thw'][0][1]*14  /  input_width = inputs['image_grid_thw'][0][2]*14
  - url: https://github.com/QwenLM/Qwen3-VL/blob/f61c3cdcffac3aa3dba0bde01c9763b87db0dccb/cookbooks/spatial_understanding.ipynb
    quote: 'Qwen2.5-VL now support these formats: * bbox-format: JSON `{"bbox_2d": [x1, y1, x2, y2], "label": "object name/description"}`'
  - url: https://www.alibabacloud.com/help/en/model-studio/vision
    quote: 'Qwen2.5-VL: The returned coordinates are absolute values in pixels, relative to the top-left corner of the scaled image.'
qwen3_vl:
  applies_to:
  - Qwen3-VL-8B-Instruct
  found: true
  prompt_template: Locate {object}, output its bbox coordinates using JSON format.
  output_format: '```json [{"bbox_2d": [x1, y1, x2, y2], "label": "..."}] ```'
  convention: norm1000_xyxy
  notes: 'Relative coordinates 0-1000 (cookbook divides by 1000; Alibaba Cloud doc states the range as [0, 999]), order x1,y1,x2,y2, independent of the resized input
    size, so map straight to the original image: x/1000*orig_w, y/1000*orig_h. Multi-object official wording: ''Locate every instance that belongs to the following
    categories: "...". Report bbox coordinates in JSON format.'' Note: the plot helper''s docstring in the notebook says ''normalized [y1 x1 y2 x2] format'' (leftover
    from a Gemini-style util) but the code indexes bbox_2d[0]->x1, [1]->y1, [2]->x2, [3]->y2, and prompts spell the format as [x1, y1, x2, y2].'
  sources:
  - url: https://github.com/QwenLM/Qwen3-VL/blob/main/cookbooks/2d_grounding.ipynb
    quote: 'Coordinate System: Qwen3-VL''s default coordinate system has been changed from the absolute coordinates used in Qwen2.5-VL to relative coordinates ranging
      from 0 to 1000. (You don''t need to calculate the resized_w)'
  - url: https://github.com/QwenLM/Qwen3-VL/blob/main/cookbooks/2d_grounding.ipynb
    quote: prompt = "Locate the top right brown cake, output its bbox coordinates using JSON format."
  - url: https://github.com/QwenLM/Qwen3-VL/blob/main/cookbooks/2d_grounding.ipynb
    quote: abs_y1 = int(bounding_box["bbox_2d"][1] / 1000 * height)  /  abs_x1 = int(bounding_box["bbox_2d"][0] / 1000 * width)
  - url: https://github.com/QwenLM/Qwen3-VL/blob/main/cookbooks/2d_grounding.ipynb
    quote: 'JSON format like this: {"bbox_2d": [x1, y1, x2, y2], "label": "vehicle", ...}'
  - url: https://github.com/QwenLM/Qwen3-VL/blob/main/README.md
    quote: Precise Object Grounding Across Formats | Using relative position coordinates, it supports both boxes and points, allowing for diverse combinations of
      positioning and labeling tasks.
  - url: https://www.alibabacloud.com/help/en/model-studio/vision
    quote: 'Qwen3-VL, Qwen3.5, Qwen3.6, and Qwen3.7 series (such as qwen3.5-plus, qwen3.6-plus, and qwen3.7-plus): The returned coordinates are relative and normalized
      to the range [0, 999] .'
