glm_4_6v:
  applies_to:
  - GLM-4.6V-Flash
  found: true
  prompt_template: Please pinpoint the bounding box [[x1,y1,x2,y2], …] in the image as per the given description. {object}
  output_format: '<|begin_of_box|>[[x1,y1,x2,y2]]<|end_of_box|> (bracket style may vary: [], [[]], (), <>)'
  convention: norm1000_xyxy
  notes: 'Each value is normalized by ORIGINAL image width (x) / height (y) and scaled by 1000; order x1,y1 (top-left), x2,y2 (bottom-right). Parse the content between
    <|begin_of_box|> and <|end_of_box|> and be tolerant of bracket style; the model may reason step by step before the box. Statement is for the GLM-4.5V/4.6V/4.1V
    family in the official GLM-V repo; the GLM-4.6V-Flash HF card itself has no grounding section but says it is ''part of the GLM-V series''. Alternative official
    wordings: ''Help me to locate <expr> in the image and give me its bounding boxes.'' (README); ''Where is the second bottle of beer from the right on the table?  Provide
    coordinates in [[xmin,ymin,xmax,ymax]] format'' (docs.z.ai); detection-style JSON with keys label and bbox_2d ([x1, y1, x2, y2]) (docs.z.ai GLM-4.6V guide).'
  sources:
  - url: https://github.com/zai-org/GLM-V/blob/main/README.md
    quote: '> - Help me to locate <expr> in the image and give me its bounding boxes.

      > - Please pinpoint the bounding box [[x1,y1,x2,y2], …] in the image as per the given description. <expr>'
  - url: https://github.com/zai-org/GLM-V/blob/main/README.md
    quote: The output bounding box is a quadruple $$[x_1,y_1,x_2,y_2]$$ composed of the coordinates of the top-left and bottom-right corners, where each value is
      normalized by the image width (for x) or height (for y) and scaled by 1000.
  - url: https://github.com/zai-org/GLM-V/blob/main/README.md
    quote: 'In the response, the special tokens `<|begin_of_box|>` and `<|end_of_box|>` are used to mark the image bounding box in the answer. The bracket style may
      vary ([], [[]], (), <>, etc.), but the meaning is the same: to enclose the coordinates of the box.'
  - url: https://docs.z.ai/guides/vlm/glm-4.6v
    quote: Where is the second bottle of beer from the right on the table?  Provide coordinates in [[xmin,ymin,xmax,ymax]] format
  - url: https://huggingface.co/zai-org/GLM-4.6V-Flash/raw/main/README.md
    quote: This Hugging Face repository hosts the `GLM-4.6V-Flash` model, part of the `GLM-V` series.
minicpm_v_4_5:
  applies_to:
  - MiniCPM-V-4_5
  found: true
  prompt_template: 'Please provide the bounding box coordinate of the region this sentence describes: <ref>{object}</ref>'
  output_format: <box>x1 y1 x2 y2</box> (four SPACE-separated integers; official regex r"<box>([\d\s]+)</box>")
  convention: norm1000_xyxy
  notes: 'Integers 0-1000 normalized by ORIGINAL image width/height, order x1 y1 x2 y2, space-separated (not comma-separated) inside <box>...</box>. Source is the
    MiniCPM-V CookBook (OpenSQZ/MiniCPM-V-CookBook), which the official openbmb/MiniCPM-V-4_5 HF card links as ''CookBook''; the HF card and the OpenBMB/MiniCPM-V
    README themselves contain no grounding text. Cookbook call: model.chat(image=None, msgs=[{''role'':''user'',''content'':[question, image]}], tokenizer=tokenizer,
    sampling=True, max_new_tokens=1024, max_inp_length=8192, use_image_id=True) - note the question precedes the image in content. Multi-object variant asks for JSON
    with a "box": "x1 y1 x2 y2" field.'
  sources:
  - url: https://github.com/OpenSQZ/MiniCPM-V-CookBook/blob/main/inference/minicpm-v4_5_grounding.md
    quote: 'question = ''Please provide the bounding box coordinate of the region this sentence describes: <ref>airplane</ref>'''
  - url: https://github.com/OpenSQZ/MiniCPM-V-CookBook/blob/main/inference/minicpm-v4_5_grounding.md
    quote: match = re.search(r"<box>([\d\s]+)</box>", response) ... bbox = list(map(int, bbox_str.strip().split()))
  - url: https://github.com/OpenSQZ/MiniCPM-V-CookBook/blob/main/inference/minicpm-v4_5_grounding.md
    quote: w, h = image.size  /  x1 = int(bbox[0] / 1000 * w)  /  y1 = int(bbox[1] / 1000 * h)  /  x2 = int(bbox[2] / 1000 * w)  /  y2 = int(bbox[3] / 1000 * h)
  - url: https://huggingface.co/openbmb/MiniCPM-V-4_5/raw/main/README.md
    quote: '[CookBook](https://github.com/OpenSQZ/MiniCPM-V-CookBook)'
gemma_4:
  applies_to:
  - gemma-4-31B-it
  found: true
  prompt_template: detect {object}, output only ```json
  output_format: '```json [{"box_2d": [y1, x1, y2, x2], "label": "..."}] ```'
  convention: norm1000_yxyx
  notes: 'ORDER IS y-first: [y_min, x_min, y_max, x_max], normalized to a 1000x1000 grid relative to the ORIGINAL image (descale: x/1000*orig_w, y/1000*orig_h). Official
    prompts are terse: ''detect person and cat'' and ''detect person and car, output only ```json''. The doc example runs google/gemma-4-E2B-it and says ''All Gemma
    4 models support variable resolution''; use a higher visual token budget (70/140/280/560/1120) for detection accuracy. The gemma-4-31B-it HF card lists ''Object
    detection ... and pointing'' under Image Understanding but gives no prompt/format; the convention comes from the official docs page (ai.google.dev/gemma/docs/capabilities/vision
    now redirects/links to gemma.ai). Output may be followed by a ''<turn|>'' end token in raw text.'
  sources:
  - url: https://gemma.ai/get-started/capabilities/image/
    quote: Models are trained to detect objects in an image and get their bounding box coordinates. Bounding box coordinates are expressed as normalized values relative
      to a 1000x1000 grid. You need to descale these coordinates based on your original image size.
  - url: https://gemma.ai/get-started/capabilities/image/
    quote: y1, x1, y2, x2 = [int(coord)/1000 for coord in coordinates]
  - url: https://gemma.ai/get-started/capabilities/image/
    quote: '{"type": "text", "text": "detect person and car, output only ```json"}'
  - url: https://gemma.ai/get-started/capabilities/image/
    quote: '{"box_2d": [243, 252, 956, 415], "label": "person"}'
  - url: https://huggingface.co/google/gemma-4-31B-it/raw/main/README.md
    quote: Image Understanding – Object detection, Document/PDF parsing, screen and UI understanding, chart comprehension, OCR (including multilingual), handwriting
      recognition, and pointing.
