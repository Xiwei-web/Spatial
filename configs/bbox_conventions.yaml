    quote: '{"type": "text", "text": "Consider the real-world 3D locations of the objects. Is the ''no motorcycle'' sign directly above the red bus?"}'
  - url: https://github.com/Yangr116/VST/blob/master/cookbook/object_detection_3d.ipynb
    quote: 'question = "Detect the 3D bounding boxes of chair"  /  3D bounding box format: [x_center, y_center, z_center, x_size, y_size, z_size, pitch, yaw, roll]'
  - url: https://arxiv.org/html/2511.05491
    quote: 'You are given several 2D bounding boxes in the image: [3, 132, 98, 468] [322, 83, 475, 481] ... Output the sorted bboxes and labels using JSON format.
      Answer [ {"bbox_2d":[324,81,477,475],"label":"person"}, {"bbox_2d":[3,130,98,462],"label":"person"} ]'
llava_1_5:
  applies_to:
  - LLaVA-1.5-7B
  - LLaVA-1.5-13B
  found: true
  prompt_template: 'Please provide the bounding box coordinate of the region this sentence describes: {object}.'
  output_format: '[x1, y1, x2, y2] with floats in [0, 1], two decimals, e.g. [0.65, 0.29, 0.78, 0.43]'
  convention: norm1_xyxy
  notes: 'Coordinates are fractions in [0,1], order left,top,right,bottom, measured on the image AFTER padding the shorter side to a square (expand2square with the
    processor image_mean), NOT on the raw image. To map back: side = max(W, H); x_px = x*side - (side-W)/2; y_px = y*side - (side-H)/2. The convention is confirmed
    by the repo owner in a GitHub issue (the paper only lists the prompt); it is not in the repo docs (docs/Data.md has no bbox text). HF-port caveat: llava-hf/llava-1.5-7b-hf
    preprocessor_config.json uses resize shortest_edge=336 + do_center_crop=true (no pad-to-square), so non-square images are center-cropped and the padded-square
    frame does not match what the model sees - pad images to square yourself before the processor for grounding. The paper''s Table of data lists the prompt without
    ''Please'' (''Provide the bounding box coordinate of the region this sentence describes.''); the released training data uses the ''Please provide ...: <phrase>.''
    form.'
  sources:
  - url: https://arxiv.org/abs/2310.03744
    quote: 'RefCOCO 48K Note: randomly choose between the two formats  Provide a short description for this region.  VG 86K  Provide the bounding box coordinate of
      the region this sentence describes. (Table 7, Instruction-following Data Mixture of LLaVA-1.5; read via ar5iv.labs.arxiv.org/html/2310.03744)'
  - url: https://github.com/haotian-liu/LLaVA/issues/606#issuecomment-1774076879
    quote: '{''from'': ''human'', ''value'': ''Please provide the bounding box coordinate of the region this sentence describes: 01 on the train.''}, {''from'': ''gpt'',
      ''value'': ''[0.65, 0.29, 0.78, 0.43]''}'
  - url: https://github.com/haotian-liu/LLaVA/issues/606#issuecomment-1774076879
    quote: it does based on image shape 336x336(or any square), but it is NOT as simple as resizing. it is padding the shorter edge to the longer, pouring processor.image_mean
      to the padding area. ... the four floats are actually `wa, ha, wb, hb`, a is the left up corner and b is the right bottom corner ... it provides a rectangle
      on the padded image.
  - url: https://github.com/haotian-liu/LLaVA/issues/606#issuecomment-1776029252
    quote: Thank you @Maxlinn and your understanding is correct. We will need to clarify this in our revised paper to make it clearer. (haotian-liu, repo OWNER)
  - url: https://huggingface.co/llava-hf/llava-1.5-7b-hf/raw/main/preprocessor_config.json
    quote: '"do_center_crop": true ... "size": { "shortest_edge": 336 }'
