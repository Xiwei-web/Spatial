internvl3:
  applies_to:
  - InternVL3-8B
  - InternVL3-2B
  found: true
  prompt_template: 'Please provide the bounding box coordinate of the region this sentence describes: <ref>{object}</ref>'
  output_format: <ref>{object}</ref><box>[[x1, y1, x2, y2]]</box>
  convention: norm1000_xyxy
  notes: 'Coordinates are integers normalized to [0, 1000] by the ORIGINAL image width/height (not per-tile), order x1,y1,x2,y2. Official parser regex: PATTERN =
    re.compile(r''\[*\[(.*?),(.*?),(.*?),(.*?)\]\]*''); the eval divides by 1000 then multiplies by original (h, w). Expected answer form: <ref>phrase</ref><box>[[x1,
    y1, x2, y2]]</box> (a bare [[x1, y1, x2, y2]] also parses). The InternVL3 HF cards only show a ''Visual Grounding'' results figure; the prompt/convention come
    from the official repo eval script and the version-agnostic ''Chat Data Format'' doc page (not InternVL3-specific pages).'
  sources:
  - url: https://github.com/OpenGVLab/InternVL/blob/main/internvl_chat/eval/refcoco/evaluate_grounding.py
    quote: 'prompt = ''Please provide the bounding box coordinate of the region this sentence describes: <ref>{}</ref>'''
  - url: https://github.com/OpenGVLab/InternVL/blob/main/internvl_chat/eval/refcoco/evaluate_grounding.py
    quote: 'if predict_bbox.sum() >= 4: predict_bbox = predict_bbox / 1000  /  predict_bbox[:, 0::2] *= output[''hw''][1]  /  predict_bbox[:, 1::2] *= output[''hw''][0]'
  - url: https://internvl.readthedocs.io/en/latest/get_started/chat_data_format.html
    quote: For grounding or detection data, we normalize each coordinate box to the range [0, 1000] using the width and height of the image, and round the normalized
      coordinates to integers
  - url: https://internvl.readthedocs.io/en/latest/get_started/chat_data_format.html
    quote: 'We organize the model''s responses in the following format: <ref>class name</ref><box>[[x1, y1, x2, y2], ...]</box>'
