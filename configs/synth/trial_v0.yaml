# F4 参数化合成场景：试跑版 trial_v0 的全部设置（切图库构建 + 场景生成）。
# 生成结果完全由「本文件 + 切图库 library.jsonl + 场景序号」决定；任何一个场景都可以单独重生成。
version: trial_v0
global_seed: 20261125
canvas: 896                      # 画布边长（像素），正方形
n_scenes: 500                    # 基础场景数；每个基础场景另有 2 张孪生图 → 共 3 × n_scenes 张
cutout_split: dev                # 试跑只用 dev 侧切图（“选择类操作只用 dev”）；正式集按 dev / test 各自生成

factors:                         # 设计表的因子（见 src/synth/generator.py: build_design）
  distance_px: [8, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384]   # 两物体完整 mask 质心沿关系轴的间距
  size_frac: [0.08, 0.12, 0.18]  # 物体大小 = 缩放后 mask 紧致框的长边 / 画布宽；像素值 = floor(frac*canvas+0.5) → 72 / 108 / 161
  axis: [horizontal, vertical]
  n_distractors: [0, 2, 4, 6]
  background: [solid, linear_gradient, radial_gradient, noise]

jitter:                          # 垂直于关系轴的随机偏移（整数像素，均匀分布在 [-J, J]）
  max_frac_of_distance: 0.25     # J = floor(min(max_frac_of_distance * distance, max_px))
  max_px: 32
placement:
  canvas_margin_px: 4            # 所有物体的框离画布边至少这么远
  distractor_gap_px: 8           # 干扰物的框与主物体（含两张孪生图里的位置）及其他干扰物的框至少隔这么远
  max_distractor_tries: 200
  max_attempts: 50               # 一个场景整体重采样的最多次数（第几次成功记在 metadata 的 seed.attempt）
occlusion:
  min_visible_fraction: 0.05     # 被压在下面的物体至少要露出这么大比例（三张图都要满足），否则整体重采样
alpha_threshold: 128             # mask := alpha >= 128
png_compress_level: 6

# 名称不同但容易混淆的类别；同一组里的类别在一个场景里最多出现一个（主物体、替换物体、干扰物都算）
confusable_groups:
  - [cup, mug, glass, wine glass, wineglass]
  - [bottle, beer bottle, water bottle, bottle of mustard, bottle of orange juice, vase]
  - [can, soda can]
  - [hat, cap, helmet]
  - [chair, armchair, couch, bench]
  - [glasses, sunglasses]
  - [yarn, ball of yarn, sports ball, orange, apple, lemon]
  - [phone, cell phone, remote]
  - [plant, potted plant, flower, rose, toy cactus]
  - [table, dining table]
  - [pot, pan, bowl, plate, frisbee]
  - [book, notepad, laptop]
  - [painting, photograph, tv]
  - [car, truck, bus]
  - [cow, sheep, horse, dog, cat, bear, zebra, giraffe, elephant]
  - [motorcycle, bicycle]
  - [knife, fork, spoon, spatula, scissors]
  - [suitcase, backpack, handbag, box]
  - [sandwich, hot dog, bread, cake, donut, pizza]
  - [skateboard, surfboard, snowboard, skis]

cutouts:                         # 切图库筛选阈值（scripts/build_cutout_library.py）
  seed: 20261125
  max_side: 256                  # 入库前把长边缩到不超过该值（场景里最大只用到 161 px）
  max_per_category: 30           # 每个（来源, 类别）最多保留多少个（按 sha256(seed:cutout_id) 排序取前 N 个）
  min_per_category: 4            # 一个类别（合并两个来源后）不足这么多就整类丢掉（保证 dev / test 各至少 2 个）
  min_mask_area_px: 9216         # mask 面积下限 = 96 × 96
  min_mask_area_frac: 0.01       # mask 面积 / 图像面积 下限
  border_margin_px: 2            # mask 的框离图像四边至少这么远（否则多半被图像边界截断）
  min_largest_component_frac: 0.95   # 最大连通块（8 连通）面积 / mask 面积 下限；入库时只保留最大连通块
  min_fill: 0.40                 # mask 面积 / mask 框面积 下限（太低多半是被遮挡成细条或形状很散）
  max_other_overlap: 0.10        # 同图任何其他实例（含 crowd）的 mask 落在本物体框内的面积 / 本物体框面积 上限
  whatsup_annotation: whatsup_annotations/auto_v1/annotations.jsonl   # 相对 <data>；只用 auto_qc == pass 的图
