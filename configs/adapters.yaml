# 每个模型在本仓库里怎么加载、怎么定位视觉 token。与 configs/models/<name>.yaml（事实清单）分开，
# 这里是“我们的用法”。kind: hf_chat | internvl_remote | minicpm_remote | unsupported
# grid:  qwen_thw（image_grid_thw + 2x2 合并）| gemma_pool | llava15 | llava_ov | internvl_tile | none
# env:   tf5 | tf4      n_gpus: 冒烟测试申请的 A100-40GB 数量（bf16 权重体积 + 余量）
defaults: {env: tf5, n_gpus: 1, chat_kwargs: {}, max_pixels: 1003520}   # 1280*28*28，仅用于限制动态分辨率模型的 token 数
models:
  Qwen2.5-VL-7B-Instruct: {kind: hf_chat, grid: qwen_thw, root: new_models}
  Qwen3-VL-8B-Instruct:   {kind: hf_chat, grid: qwen_thw, root: new_models}
  RoboBrain2.0-7B:        {kind: hf_chat, grid: qwen_thw}
  VST-7B-RL:              {kind: hf_chat, grid: qwen_thw}
  Qwen3.5-2B:             {kind: hf_chat, grid: qwen_thw, chat_kwargs: {enable_thinking: false}}
  Qwen3.5-4B:             {kind: hf_chat, grid: qwen_thw, chat_kwargs: {enable_thinking: false}}
  Qwen3.5-9B:             {kind: hf_chat, grid: qwen_thw, chat_kwargs: {enable_thinking: false}}
  Qwen3.6-27B:            {kind: hf_chat, grid: qwen_thw, chat_kwargs: {enable_thinking: false}, n_gpus: 3}
  Qwen3.8-27B:            {kind: hf_chat, grid: qwen_thw, chat_kwargs: {enable_thinking: false}, n_gpus: 3}
  Qwen3.6-35B-A3B:        {kind: hf_chat, grid: qwen_thw, chat_kwargs: {enable_thinking: false}, n_gpus: 4}
  GLM-4.6V-Flash:         {kind: hf_chat, grid: qwen_thw, chat_kwargs: {enable_thinking: false}}
  gemma-4-31B-it:         {kind: hf_chat, grid: gemma_pool, chat_kwargs: {enable_thinking: false}, n_gpus: 3}
  LLaVA-OneVision-7B:     {kind: hf_chat, grid: llava_ov, max_image_side: 768, n_gpus: 2}   # 原图 1280x960 默认 anyres 产生 7309 个视觉 token，eager 注意力在 40GB 上 OOM；输入先等比缩到长边 768
  LLaVA-1.5-7B:           {kind: hf_chat, grid: llava15, root: new_models}
  LLaVA-1.5-13B:          {kind: hf_chat, grid: llava15, root: new_models}
  InternVL3-8B:           {kind: internvl_remote, grid: internvl_tile, env: tf4, root: new_models}
  InternVL3-2B:           {kind: internvl_remote, grid: internvl_tile, env: tf4, root: new_models}
  InternVL3_5-8B:         {kind: internvl_remote, grid: internvl_tile, env: tf4}
  SenseNova-SI-1.1-InternVL3-2B: {kind: internvl_remote, grid: internvl_tile, env: tf4}
  SenseNova-SI-1.2-InternVL3-8B: {kind: internvl_remote, grid: internvl_tile, env: tf4}
  SenseNova-SI-1.3-InternVL3-8B: {kind: internvl_remote, grid: internvl_tile, env: tf4}
  MiniCPM-V-4_5:          {kind: minicpm_remote, grid: none, env: tf4}
  Cambrian-S-7B:          {kind: unsupported, reason: "model_type=cambrian_qwen 不在 transformers 中，需要官方 cambrian-s 代码库及其依赖环境；本阶段未适配"}
