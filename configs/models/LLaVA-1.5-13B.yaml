loader:
  model_class: LlavaForConditionalGeneration
  processor_class: LlavaProcessor
  trust_remote_code: false
  config_transformers_version: 4.36.0.dev0
  notes: |
    - Native transformers classes, no .py files in the model dir. config.json architectures = LlavaForConditionalGeneration; in transformers 5.24.1 model_type llava maps to LlavaForConditionalGeneration (MODEL_FOR_IMAGE_TEXT_TO_TEXT_MAPPING_NAMES, models/auto/modeling_auto.py:1245) and LlavaProcessor (PROCESSOR_MAPPING_NAMES, models/auto/auto_mappings.py:1311).
    - Image processor: preprocessor_config.json names image_processor_type CLIPImageProcessor (processor_class LlavaProcessor). The transformers 5.24.1 default for model_type llava is LlavaImageProcessor (auto_mappings.py:1466), which has an extra do_pad / pad_to_square option defaulting to False (models/llava/image_processing_llava.py:45, 120-123). Which class AutoProcessor instantiates from this file was not tested; with the shipped settings both do resize + center crop and no padding.
    - Tokenizer: tokenizer_class LlamaTokenizer, padding_side left, <image> id 32000, <pad> id 32001, add_bos_token true.
    - README requirements: "First, make sure to have `transformers >= 4.35.3`"; "From transformers>=v4.48, you can also pass image url or local path to the conversation history". README loads with torch_dtype=torch.float16, low_cpu_mem_usage=True and generates with do_sample=False.
    - Prompt format (README): "USER: xxx\nASSISTANT:" with `<image>` in the prompt. chat_template: role upper-cased + ': ', all images of a message rendered first as '<image>\n' regardless of their position in the content list, then text parts each followed by a space, generation prompt 'ASSISTANT:'. System messages get no role prefix. No default system prompt.
    - Checkpoint tensor names use the old layout (language_model.model.layers.*, multi_modal_projector.*, vision_tower.vision_model.*) while the 5.24.1 class nests them under `model.`; loading relies on transformers' key remapping. Not tested (no weights loaded).
    - torch_dtype float16. generation_config.json: bos 1, eos 2, pad 32001 (no sampling settings). This dir has chat_template.json only (the 7B dir additionally ships chat_template.jinja with the same template).
