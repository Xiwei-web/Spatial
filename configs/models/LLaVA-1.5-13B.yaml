  mixer_details: |
    All 40 layers are standard causal full self-attention, plain multi-head (num_key_value_heads == num_attention_heads == 40, no KV sharing). The Llama architecture has no sliding-window mechanism (no sliding_window / layer_types in models/llama/configuration_llama.py or modeling_llama.py).
    config.json text_config states hidden_size 5120, intermediate_size 13824, num_attention_heads 40, num_hidden_layers 40, num_key_value_heads 40, max_position_embeddings 4096, vocab_size 32064; _name_or_path is "meta-llama/Llama-2-13b-hf" (not a Vicuna id, unlike the 7B config which says lmsys/vicuna-7b-v1.5). Cross-checked against the safetensors headers: 40 language_model layers, q_proj/k_proj/o_proj weight shape [5120, 5120], embed_tokens [32064, 5120].
    head_dim is computed: LlamaConfig.__post_init__ sets head_dim = hidden_size // num_attention_heads = 5120 // 40 = 128 (configuration_llama.py:85-89).
    Position encoding: RoPE (LlamaConfig defaults; no rope settings in config.json). max_position_embeddings 4096.
  mlp_type: dense (LlamaForCausalLM; intermediate_size 13824; hidden_act silu = LlamaConfig default)
  head_level_analysis: |
    All 40 layers have the same structure (40 heads x 128 dims, independent K/V per head), so head-level analysis / attention masking applies to every layer.
    Attention weights require attn_implementation="eager" (config.output_attentions raises otherwise, configuration_utils.py:582-592). The CLIP vision tower is also a standard transformers module (attention weights available the same way). Not run here.
vision_encoder:
  type: CLIP vision transformer (vision_config.model_type clip_vision_model -> CLIPVisionModel via AutoModel.from_config, modeling_llava.py:111); 16 heads, intermediate_size 4096, projection_dim 768. The model card does not name the CLIP checkpoint.
  num_layers: 24
  hidden_size: 1024
  patch_size: 14
  resolution_strategy: |
    fixed 336x336 (vision_config.image_size 336) -> 24x24 = 576 patches + 1 CLS (position_embedding weight shape [577, 1024] in the safetensors header).
    Preprocessing per preprocessor_config.json: do_convert_rgb, do_resize with size {shortest_edge: 336} (aspect ratio preserved, resample 3 = bicubic), do_center_crop with crop_size 336x336, rescale 1/255, normalize with CLIP mean [0.48145466, 0.4578275, 0.40821073] / std [0.26862954, 0.26130258, 0.27577711]. There is NO pad-to-square: the file has no do_pad key, so for non-square images the parts outside the central square along the longer side are cropped away.
  position_encoding: Learned absolute position embedding, nn.Embedding(577, 1024) = CLS + 24x24 (models/clip/modeling_clip.py CLIPVisionEmbeddings, lines 146-159; used as-is at 336x336, lines 176-177). No rotary / relative encoding.
connector:
  type: 'LlavaMultiModalProjector: Linear(1024, 5120) -> GELU -> Linear(5120, 5120) (modeling_llava.py:66-85; projector_hidden_act gelu; shapes confirmed in the safetensors header). Input features: vision tower hidden_states[vision_feature_layer = -2] (penultimate entry of the CLIP hidden-states tuple, so the last CLIP layer''s output is not used), CLS removed because vision_feature_select_strategy = "default" (modeling_llava.py:141-144).'
  token_merge: none (1 patch -> 1 token)
  tokens_per_image: |
    576, fixed. Processor: (336 // 14) * (336 // 14) + num_additional_image_tokens (1, processor_config.json) - 1 (strategy "default") = 576 (processing_llava.py:63-69). LlavaConfig.image_seq_length default is also 576.
    The single '<image>' in the prompt is expanded to 576 <image> tokens (id 32000); no start/end or newline tokens are added by the processor (the chat template puts a text '\n' after it).
  token_to_region: |
    Raster (row-major) order of the 24x24 patch grid of the 336x336 preprocessed crop (Conv2d patch embedding flattened with flatten(2), CLS at index 0 removed). Image token k (0..575): row r = k // 24, col c = k % 24, covering crop pixels x in [14c, 14c+14), y in [14r, 14r+14).
    Crop -> original image: scale s = 336 / min(H, W) (shortest edge resized to 336), then a centered 336x336 crop; original coords ~ ((x + off_x) / s, (y + off_y) / s) with off = (resized_long_side - 336) / 2 on the longer axis and 0 on the shorter axis. Exact rounding of the resized size / crop offset follows the torchvision backend and was not traced.
    Image features are written into the <image> positions by masked_scatter (modeling_llava.py:230-236).
multi_view:
  default: 'Single view: one 336x336 image -> 576 tokens. No tiling, no thumbnail, no anyres (that is LLaVA-NeXT / OneVision, not this model).'
  force_single_view: |
    Nothing to disable. Note the default view is a CENTER CROP of the short-side-resized image (preprocessor_config.json: do_resize shortest_edge 336 + do_center_crop 336x336), not a padded full image.
    To make the whole image visible, pre-process it yourself to a square before the processor (e.g. pad to square or resize to 336x336); the transformers LlavaImageProcessor has a do_pad option (pad to square with the mean colour, image_processing_llava.py:55-95, 120-123) but it is not enabled by the shipped config and the model card does not mention it.
