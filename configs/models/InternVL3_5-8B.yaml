  README.md line 135: "We initialize the language model using the Qwen3 series and GPT-OSS, and the vision encoder using InternViT-300M and InternViT-6B."
  config.json llm_config._name_or_path (line 15) is a training-machine path whose last component is "Qwen3-8B"; llm_config.architectures is Qwen3ForCausalLM.
