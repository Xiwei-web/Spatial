loader:
  model_class: 'AutoModel (config.json auto_map -> modeling_internvl_chat.InternVLChatModel; architectures: InternVLChatModel)'
  processor_class: |
    For the remote-code path (README): AutoTokenizer(path, trust_remote_code=True, use_fast=False) -> tokenizer_class Qwen2Tokenizer; images are preprocessed by the caller with the README functions build_transform / dynamic_preprocess / load_image (no processor object).
    The directory additionally ships processor_config.json / preprocessor_config.json / video_preprocessor_config.json / chat_template.jinja that name processor_class InternVLProcessor (image_processor_type GotOcr2ImageProcessorFast, video_processor_type InternVLVideoProcessor); see loader.notes.
  trust_remote_code: true
  config_transformers_version: null
  notes: |
    - config.json top-level `transformers_version` is null (line 58) and llm_config has no transformers_version; generation_config.json records "4.52.1".
    - README.md line 360: "Please use transformers>=4.52.1 to ensure the model works normally. For the 20B version of our model, transformers>=4.55.0 is required."
    - Remote code asserts transformers >= 4.37.0 (modeling_internvl_chat.py:52) but imports `Qwen3ForCausalLM, Qwen3MoeForCausalLM` from transformers at module import time (line 18), so a transformers that has Qwen3 is required in practice.
    - README loading call: AutoModel.from_pretrained(path, torch_dtype=torch.bfloat16, low_cpu_mem_usage=True, use_flash_attn=True, trust_remote_code=True).eval().cuda()
    - This is the "GitHub format" checkpoint (README.md line 41: "we provide two model formats: the GitHub format ..., consistent with prior releases, and the HF format ..., aligned with the official Transformers standard"). config.json model_type is `internvl_chat` with auto_map; weight key prefixes are language_model.* / vision_model.* / mlp1.* (model.safetensors.index.json). The HF-native class in transformers uses model_type `internvl` (transformers models/internvl/configuration_internvl.py:108), which this config.json does not declare, so the native InternVLForConditionalGeneration path belongs to the separate OpenGVLab/InternVL3_5-8B-HF repo (README table line 70), which is NOT downloaded here.
    - The HF-native processor files are nevertheless present: processor_config.json {image_seq_length: 256, processor_class: InternVLProcessor}; preprocessor_config.json {image_processor_type: GotOcr2ImageProcessorFast, size 448x448, crop_to_patches: false, min_patches: 1, max_patches: 12, ImageNet mean/std}; chat_template.jinja (plain ChatML, emits '<image>\n' / '<video>\n' placeholders, no system prompt, no thinking switch). Implication: AutoProcessor may be loadable from this dir, but its use together with the remote-code InternVLChatModel.chat() is not documented in the README and was not tested. Note preprocessor_config.json has crop_to_patches: false while the README pipeline tiles with max_num=12 - the two paths do not have the same default tiling.
    - Remote code needs `einops` and `timm` (modeling_intern_vit.py:12-13); flash_attn is optional (try/except, lines 23-30).
    - Attention weights: InternVLChatModel.__init__ sets `config.llm_config._attn_implementation = 'flash_attention_2' if use_flash_attn else 'eager'` (modeling_internvl_chat.py:63) where `use_flash_attn = use_flash_attn if has_flash_attn else False` (line 61) and the __init__ default is use_flash_attn=True (line 49). So the LLM attention backend is decided by the `use_flash_attn` kwarg and by whether the flash_attn package imports; pass `use_flash_attn=False` to from_pretrained to get 'eager'. In this model's config.json the llm_config has no attn_implementation key.
