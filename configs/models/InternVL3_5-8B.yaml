thinking:
  has_thinking_mode: true
  how_to_disable: |
    Thinking is OFF by default and is switched on only by a system prompt. README.md lines 410-426: "To enable thinking mode, please set the system prompt to our Thinking System Prompt. When enabling Thinking mode, we recommend setting `do_sample=True` and `temperature=0.6` to mitigate undesired repetition." followed by R1_SYSTEM_PROMPT and `model.system_message = R1_SYSTEMP_PROMPT` (sic - the README assigns a misspelled variable name).
    R1_SYSTEM_PROMPT text (README.md lines 416-422):
    "You are an AI assistant that rigorously follows this response protocol:

    1. First, conduct a detailed analysis of the question. Consider different angles, potential solutions, and reason through the problem step-by-step. Enclose this entire thinking process within <think> and </think> tags.

    2. After the thinking section, provide a clear, concise, and direct answer to the user's question. Separate the answer from the think section with a newline.

    Ensure that the thinking process is thorough but remains focused on the query. The final answer should be standalone and not reference the thinking section."
    To keep it disabled: do not set model.system_message. The default is the conv template's system message (template "internvl2_5", conversation.py:384-390: '你是书生·万象，英文名是InternVL，是由上海人工智能实验室、清华大学及多家合作单位联合开发的多模态大语言模型。'), which chat() always prepends (modeling_internvl_chat.py:278-279).
    chat_template.jinja contains no thinking switch (no enable_thinking variable) and adds no system prompt by itself. <think> / </think> are added tokens (ids 151667 / 151668).
  source: README.md lines 80, 410-426; conversation.py lines 384-390; chat_template.jinja; added_tokens.json
