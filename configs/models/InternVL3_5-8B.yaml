  mixer_details: |
    All 36 layers are standard causal full self-attention with grouped-query attention (32 query heads, 8 KV heads, head_dim 128 stated in config.json llm_config).
    No sliding window is active: llm_config has use_sliding_window: false and sliding_window: null (max_window_layers: 36 is therefore inert). In transformers 5.5.4 Qwen3Config.__post_init__ sets sliding_window=None when use_sliding_window is false and then builds layer_types as all "full_attention" (models/qwen3/configuration_qwen3.py:87-94).
    architectures: Qwen3ForCausalLM (not the Moe class).
  mlp_type: dense (architectures = Qwen3ForCausalLM; hidden_act silu, intermediate_size 12288)
  head_level_analysis: |
    All 36 layers have the same structure (32 heads), so head-level analysis is structurally possible on every layer.
    Precondition: the LLM must run with the eager attention backend, otherwise attention weights are not materialised. The remote code forces llm_config._attn_implementation to 'flash_attention_2' when use_flash_attn=True and flash_attn is importable (modeling_internvl_chat.py:61-63); load with use_flash_attn=False to get 'eager'. In transformers 5.5.4 only eager_attention_forward returns the softmaxed weights (models/qwen3/modeling_qwen3.py:196-218) and config.output_attentions raises unless _attn_implementation is 'eager' (configuration_utils.py:346-351).
    InternVLChatModel.forward passes output_attentions through to the language model and returns outputs.attentions (modeling_internvl_chat.py:148,176).
    Head masking is not offered by an argument in the code read; it would need hooks. Not tested (no weights were loaded).
    Vision encoder: InternAttention never returns attention weights (_naive_attn returns only x; FlashAttention asserts not need_weights), so ViT attention needs hooks / re-computation.
vision_encoder:
  type: |
    InternVisionModel from the shipped modeling_intern_vit.py. config.json vision_config.model_type is the string "intern_vit_6b", but the actual dimensions are hidden_size 1024, 24 layers, 16 heads, intermediate_size 4096, norm_type layer_norm, qkv_bias true.
    README naming: line 135 says the series uses "InternViT-300M and InternViT-6B"; the family table (line 54) lists InternVL3.5-8B with #Vision Param 0.3B. The README does not print the exact vision checkpoint name for the 8B model.
  num_layers: 24
  hidden_size: 1024
  patch_size: 14
  resolution_strategy: |
    Encoder input is fixed 448x448 per tile (vision_config.image_size 448, force_image_size 448) -> 32x32 = 1024 patch tokens + 1 CLS.
    Higher resolution is handled outside the encoder by dynamic tiling: config dynamic_image_size true, min_dynamic_patch 1, max_dynamic_patch 12, use_thumbnail true (see multi_view).
  position_encoding: |
    Learned absolute position embedding: nn.Parameter of shape (1, 1025, 1024) = CLS + 32x32 (modeling_intern_vit.py:149-152).
    At forward time the patch part is passed through _get_pos_embed, which bicubic-interpolates (F.interpolate, mode='bicubic', align_corners=False) the 32x32 grid to the actual (H, W) patch grid (lines 154-173); at 448x448 input this is the identity size. No rotary / 2D relative encoding in the ViT.
connector:
  type: |
    pixel_shuffle (space-to-depth, downsample_ratio 0.5, ps_version v2) followed by `mlp1` = Sequential(LayerNorm(4096), Linear(4096, 4096), GELU(), Linear(4096, 4096)) (modeling_internvl_chat.py:89-94; 4096 = vit_hidden 1024 * int(1/0.5)^2; llm hidden 4096). Uses the last ViT layer (select_layer -1), CLS token dropped.
  token_merge: 2x2 patch merge by pixel_shuffle (4 ViT patch tokens -> 1 LLM token, channels concatenated 1024 -> 4096); 4x token reduction
  tokens_per_image: |
    256 per 448x448 tile: num_image_token = int((448 // 14) ** 2 * (0.5 ** 2)) = int(1024 * 0.25) = 256 (modeling_internvl_chat.py:58). README.md line 141 agrees ("1024 visual tokens ... compressed into 256 tokens via a pixel shuffle module"); processor_config.json image_seq_length = 256.
    Per image: 256 * num_tiles, where num_tiles = grid tiles (1..max_num) + 1 thumbnail if grid tiles > 1. In the prompt each image becomes '<img>' + '<IMG_CONTEXT>' * 256 * num_tiles + '</img>' (modeling_internvl_chat.py:295), i.e. one <img>...</img> pair per image, not per tile.
    Token ids (added_tokens.json): <img> 151669, </img> 151670, <IMG_CONTEXT> 151671.
  token_to_region: |
    Derived from the shipped remote code (extract_feature + pixel_shuffle, ps_version=v2), not from a doc statement.
    1) The ViT output drops the CLS token (vit_embeds[:, 1:, :]) and is reshaped to (tiles, 32, 32, 1024), row-major: dim1 = patch row (y), dim2 = patch column (x).
    2) pixel_shuffle(scale_factor=0.5): view -> merges horizontally adjacent patch pairs into channels; permute(0,2,1,3); view -> merges vertically adjacent pairs; for ps_version != 'v1' a final permute(0,2,1,3) restores (row, col) order. Result (tiles, 16, 16, 4096).
    3) reshape(tiles, -1, 4096) flattens row-major, so within one 448x448 tile, token k (0..255) has row i = k // 16, col j = k % 16 and covers ViT patches rows 2i..2i+1, cols 2j..2j+1, i.e. tile pixels x in [28*j, 28*j+28), y in [28*i, 28*i+28).
       Channel concat order inside a token: patch(2i,2j), patch(2i,2j+1), patch(2i+1,2j), patch(2i+1,2j+1).
    4) Across tiles: the n-th <IMG_CONTEXT> position of an image (n counted from 0) maps to tile t = n // 256, k = n % 256, because vit_embeds.reshape(-1, C) is written into the IMG_CONTEXT positions in order. Tile order = order of pixel_values along dim 0 (see multi_view).
    5) Tile pixel -> original image pixel depends on the caller's preprocessing (tile grid cols x rows, each tile is a crop of the image resized to (448*cols, 448*rows) without keeping aspect ratio; the thumbnail is the whole image resized to 448x448).
multi_view:
  default: |
    Dynamic tiling ON by default in the README pipeline: load_image(image_file, input_size=448, max_num=12) calls dynamic_preprocess(..., use_thumbnail=True, max_num=max_num); config.json has dynamic_image_size true, min_dynamic_patch 1, max_dynamic_patch 12, use_thumbnail true.
    IMPORTANT: modeling_internvl_chat.py (inference code) never reads dynamic_image_size / min_dynamic_patch / max_dynamic_patch / use_thumbnail; tiling is done entirely by the caller's preprocessing, and the model just consumes pixel_values of shape (total_tiles, 3, 448, 448) plus num_patches_list.
    Tile choice: the (cols, rows) grid with cols*rows <= max_num whose aspect ratio is closest to the image's; the image is resized to (448*cols, 448*rows) (aspect ratio not preserved exactly) and cropped.
    Tile order in the sequence: row-major over the grid - tile i has column i % cols and row i // cols (left-to-right, then top-to-bottom). The thumbnail (whole image resized to 448x448) is appended LAST, and only when there is more than one grid tile.
    All tiles of one image share a single <img> ... </img> span of 256*num_tiles <IMG_CONTEXT> tokens, in the same order as pixel_values.
    Multi-image: pixel_values of the images are concatenated along dim 0 and num_patches_list gives tiles per image; each '<image>' placeholder in the question is replaced in order (modeling_internvl_chat.py:294-296). The README video example uses max_num=1 per frame (line 614, 633).
    InternVL3_5-8B/README.md dynamic_preprocess (lines 468-504), quoted:
        target_ratios = set(
            (i, j) for n in range(min_num, max_num + 1) for i in range(1, n + 1) for j in range(1, n + 1) if
            i * j <= max_num and i * j >= min_num)
        ...
        resized_img = image.resize((target_width, target_height))
        for i in range(blocks):
            box = (
                (i % (target_width // image_size)) * image_size,
                (i // (target_width // image_size)) * image_size,
                ((i % (target_width // image_size)) + 1) * image_size,
                ((i // (target_width // image_size)) + 1) * image_size
            )
            split_img = resized_img.crop(box)
            processed_images.append(split_img)
        if use_thumbnail and len(processed_images) != 1:
            thumbnail_img = image.resize((image_size, image_size))
            processed_images.append(thumbnail_img)
    load_image (lines 506-512), quoted:
        images = dynamic_preprocess(image, image_size=input_size, use_thumbnail=True, max_num=max_num)
        pixel_values = [transform(image) for image in images]
        pixel_values = torch.stack(pixel_values)
  force_single_view: |
    Call the README loader with max_num=1: load_image(path, max_num=1). Then target_ratios = {(1, 1)}, blocks = 1, and the thumbnail is NOT added because of `if use_thumbnail and len(processed_images) != 1:` (README.md line 501). Result: pixel_values of shape (1, 3, 448, 448) = the whole image resized to 448x448 (aspect ratio not preserved), 256 image tokens.
    Equivalent without the helper: pass pixel_values with exactly one 448x448 tensor per image and num_patches_list=[1] (chat() defaults num_patches_list to [pixel_values.shape[0]], modeling_internvl_chat.py:271-272).
    Note a (1,1) grid can also be selected naturally for near-square images under max_num=12 only if it is the closest aspect ratio and wins the tie-break; do not rely on that - set max_num=1.
