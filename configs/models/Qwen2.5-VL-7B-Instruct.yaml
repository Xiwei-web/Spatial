  - full_attention
  - full_attention
  mixer_details: |
    All 28 layers are plain causal self-attention with grouped-query attention (28 query heads, 4 KV heads; each KV head shared by 7 query heads; k_proj weight shape [512, 3584] in the safetensors header).
    Sliding window is inactive: config.json has sliding_window=32768, max_window_layers=28, use_sliding_window=false. Qwen2_5_VLTextConfig.__post_init__ sets sliding_window=None when use_sliding_window is false and builds layer_types as "sliding_attention" only if sliding_window is not None and i >= max_window_layers (configuration_qwen2_5_vl.py:129-142), so all 28 entries are "full_attention" (and i >= 28 never holds for 28 layers anyway).
    head_dim is computed, not stated: hidden_size // num_heads = 3584 // 28 = 128 (modeling_qwen2_5_vl.py:612). top-level model_type in config.json is qwen2_5_vl; qwen2_5_vl_text is the transformers text sub-config type.
    LM position encoding: multimodal RoPE, rope_scaling {type: mrope, mrope_section: [16, 24, 24]}, rope_theta 1e6. max_position_embeddings 128000.
  mlp_type: dense (gate_proj/up_proj/down_proj, hidden_act silu, intermediate_size 18944)
  head_level_analysis: |
    All 28 layers share the same standard structure (q_proj -> 28 heads x 128 dims; o_proj takes the concatenated heads, modeling_qwen2_5_vl.py:625-628), so head-level analysis / attention masking applies to every layer. K/V are shared within groups of 7 query heads.
    Attention weights are produced by eager_attention_forward (modeling_qwen2_5_vl.py:234-256); setting config.output_attentions with a non-eager attn implementation raises (configuration_utils.py:582-592). Load with attn_implementation="eager". Not run here.
vision_encoder:
  type: Qwen2.5-VL ViT (Qwen2_5_VisionTransformerPretrainedModel) with window attention; README:46 "window attention ... SwiGLU and RMSNorm"
  num_layers: 32
  hidden_size: 1280
  patch_size: 14
  resolution_strategy: |
    dynamic (native aspect ratio, one grid per image). Qwen2VLImageProcessor.smart_resize (image_processing_qwen2_vl.py:63-89) with factor = patch 14 x merge 2 = 28: round H and W to multiples of 28; if H*W > max_pixels scale down (floor to multiple of 28); if H*W < min_pixels scale up (ceil); aspect ratio > 200 raises.
    Shipped preprocessor_config.json: min_pixels=3136 (56x56 -> 4 tokens), max_pixels=12845056 (= 16384 x 28 x 28 -> 16384 tokens). Resample bicubic (class default), CLIP mean/std.
    README:160 "The default range for the number of visual tokens per image in the model is 4-16384"; README:161-164 / 427-435 suggest e.g. min_pixels = 256*28*28, max_pixels = 1280*28*28 (token range 256-1280) "to balance performance and cost".
  position_encoding: |
    2D rotary position embedding on (row, col) patch indices in every vision block (rotary_pos_emb, modeling_qwen2_5_vl.py:410, 461; position ids from vision_utils.get_vision_position_ids). No learned absolute position table.
    Window attention: window_size 112 px (= 8x8 patches = 4x4 merged cells); blocks 7, 15, 23, 31 (fullatt_block_indexes) attend over the whole image, the other 28 of 32 blocks attend only inside windows (modeling_qwen2_5_vl.py:466-472). 16 heads. temporal_patch_size 2: a still image is duplicated to 2 frames and embedded by a Conv3d (image_processing_qwen2_vl.py:201-209, modeling_qwen2_5_vl.py:113-114).
connector:
  type: 'Qwen2_5_VLPatchMerger (inside the vision tower, visual.merger): RMSNorm(1280), concatenate each 2x2 patch group (4 x 1280 = 5120), MLP Linear(5120,5120) -> GELU -> Linear(5120,3584) (modeling_qwen2_5_vl.py:185-198; shapes confirmed in the safetensors header)'
  token_merge: 2x2 spatial merge (4 patches -> 1 token), spatial_merge_size 2
  tokens_per_image: |
    (H'/28) * (W'/28), where (H', W') is the smart_resize output. Processor: image_grid_thw.prod() // merge_size**2 with grid_t = 1 for a still image (processing_qwen2_5_vl.py:51-54).
    Placeholders are <|image_pad|> (id 151655) wrapped as <|vision_start|><|image_pad|>...<|vision_end|> by the chat template. With shipped limits: 4 to 16384 tokens per image.
  token_to_region: |
    Tokens reaching the LM are in raster (row-major) order of merged 28x28 px cells.
    Details: the image processor orders patches as (merged_row, merged_col, 2x2 inside the cell) (image_processing_qwen2_vl.py:187-199); the vision tower permutes merged cells into window order for window attention (permute_input_for_window_attn, modeling_qwen2_5_vl.py:422-426, 459); the merger fuses each consecutive group of 4 patches; then merged_hidden_states[argsort(window_index)] restores the original order (lines 482-484) before masked_scatter into the <|image_pad|> positions (line 1222).
    Rule: with gw = W'/28, image token k (0-based) is row r = k // gw, col c = k % gw and covers resized-image pixels x in [28c, 28c+28), y in [28r, 28r+28); in original-image pixels multiply x by W/W' and y by H/H'.
    CAVEAT for ViT internals: pre-merger hidden states (last_hidden_state / per-block outputs) stay in WINDOW order; only the merged pooler_output is un-permuted (lines 486-489).
multi_view:
  default: Single view. No tiling, no thumbnail, no newline/separator tokens; one native-resolution grid per image.
  force_single_view: |
    Nothing to disable. To fix the token count: (a) processor/image-processor init kwargs min_pixels / max_pixels (README:162-164, 430-435), which transformers 5.24.1 maps to size shortest_edge / longest_edge (image_processing_qwen2_vl.py:109-119; passing them at call time emits a deprecation warning, lines 128-133); or (b) pre-resize the image so H and W are multiples of 28 inside the pixel range.
    README:437-441 also describes per-image `resized_height` / `resized_width` ("rounded to the nearest multiple of 28") and per-image min_pixels/max_pixels in the message dict; these are handled by qwen_vl_utils.process_vision_info, not by the transformers processor.
