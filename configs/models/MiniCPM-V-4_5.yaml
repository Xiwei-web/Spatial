thinking:
  has_thinking_mode: true
  how_to_disable: >-
    model.chat(..., enable_thinking=False)，这是 chat() 的默认值（modeling_minicpmv.py:351）。
    README.md:253："If you wish to enable thinking mode, provide the argument `enable_thinking=True` to the chat function."；
    README.md:270：`enable_thinking=False # If `enable_thinking=True`, the thinking mode is enabled.`
    chat() 把该参数传给 tokenizer.apply_chat_template（:414）；tokenizer_config.json 的 chat_template 在 generation prompt
    `<|im_start|>assistant\n` 之后：enable_thinking 为 false 时预填 `<think>\n\n</think>\n\n`，为 true 时预填 `<think>\n`（模板第 80-87 行）；
    若自己调模板且不传 enable_thinking，则两者都不预填。generation_config.json:12 也写了 chat_template_kwargs.enable_thinking=false。
    开启思考时 chat() 的采样参数不同（关闭时额外加 top_p=0.8, top_k=100, repetition_penalty=1.03，:437-444）。
  source: "README.md:33,53,253,270；modeling_minicpmv.py:351,414-420；tokenizer_config.json chat_template；generation_config.json:12"
