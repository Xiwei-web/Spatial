  - full_attention
  mixer_details: |
    All 28 layers are standard causal full self-attention with grouped-query attention (12 query heads, 2 KV heads; k_proj weight shape [256, 1536] in the safetensors header). llm_config.architectures = Qwen2ForCausalLM.
    head_dim 128 is computed, not stated: llm_config has no head_dim key; Qwen2Attention uses getattr(config, "head_dim", hidden_size // num_attention_heads) = 1536 // 12 = 128 (transformers models/qwen2/modeling_qwen2.py:176).
    No sliding window is active: llm_config has use_sliding_window: false and sliding_window: null (max_window_layers: 70 > 28 layers, inert). Qwen2Config.__post_init__ sets sliding_window=None when use_sliding_window is false and builds layer_types as all "full_attention" (models/qwen2/configuration_qwen2.py:82-93).
    rope_scaling in llm_config: {factor: 2.0, rope_type: dynamic, type: dynamic}; rope_theta 1000000.0; max_position_embeddings 32768; vocab_size 151674.
    llm_config._name_or_path is "./pretrained/Qwen2.5-32B-Instruct", which does not match the dimensions (hidden 1536, 28 layers); treat it as a stale string. The README family table (line 44) gives the language part as Qwen2.5-1.5B.
  mlp_type: dense (Qwen2ForCausalLM; hidden_act silu, intermediate_size 8960; llm_config.moe_config is null)
  head_level_analysis: |
    All 28 layers have the same structure (12 heads x 128 dims), so head-level analysis is structurally possible on every layer; K/V shared within groups of 6 query heads.
    Precondition: eager attention in the LLM. Load with use_flash_attn=False so the remote code sets 'eager' (modeling_internvl_chat.py:55-57). InternVLChatModel.forward passes output_attentions to the language model and returns outputs.attentions (lines 137, 165); config.output_attentions raises unless the attn implementation is eager (transformers configuration_utils.py:582-592).
    No head-mask argument in the code read; masking needs hooks. Vision encoder: InternAttention never returns attention weights (_naive_attn returns only x; modeling_intern_vit.py:210-248), so ViT attention needs hooks / recomputation. Not tested (no weights loaded).
vision_encoder:
  type: |
    InternVisionModel from the shipped modeling_intern_vit.py. README family table: Vision Part = InternViT-300M-448px-V2_5.
    config.json vision_config.model_type is "intern_vit_6b" and vision_config._name_or_path is "OpenGVLab/InternViT-6B-448px-V1-5", but the actual dimensions are hidden_size 1024, 24 layers, 16 heads, intermediate_size 4096, norm_type layer_norm, qkv_bias true (300M-sized; the two strings are stale). vision_config also carries MoE-style keys (num_experts 8, use_moe false, ...) that the shipped modeling_intern_vit.py does not read.
  num_layers: 24
  hidden_size: 1024
  patch_size: 14
  resolution_strategy: |
    Encoder input is fixed 448x448 per tile (vision_config.image_size 448, force_image_size 448) -> 32x32 = 1024 patch tokens + 1 CLS.
    Higher resolution is handled outside the encoder by dynamic tiling in the caller's preprocessing: config dynamic_image_size true, min_dynamic_patch 1, max_dynamic_patch 12, use_thumbnail true; README load_image default max_num=12 (see multi_view). README:60 "dividing images into tiles of 448x448 pixels".
    Per-tile transform (README:270-278): convert RGB, T.Resize((448, 448), interpolation=BICUBIC), ToTensor, Normalize with IMAGENET_MEAN (0.485, 0.456, 0.406) / IMAGENET_STD (0.229, 0.224, 0.225).
  position_encoding: |
    Learned absolute position embedding: nn.Parameter of shape (1, 1025, 1024) = CLS + 32x32 (modeling_intern_vit.py:149-152; shape confirmed in the safetensors header).
    At forward time the patch part goes through _get_pos_embed, which bicubic-interpolates (F.interpolate, mode='bicubic', align_corners=False) the 32x32 grid to the actual patch grid (lines 154-173); at 448x448 this is the same size. No rotary / relative encoding in the ViT.
connector:
  type: pixel_shuffle (space-to-depth, downsample_ratio 0.5, ps_version v2) followed by mlp1 = Sequential(LayerNorm(4096), Linear(4096, 1536), GELU(), Linear(1536, 1536)) (modeling_internvl_chat.py:78-83, 168-202; 4096 = 1024 * 2^2). Uses the last ViT layer (select_layer -1), CLS token dropped (line 195). README:55 "ViT-MLP-LLM" with "a randomly initialized MLP projector"; README:60 "pixel unshuffle operation, reducing the number of visual tokens to one-quarter".
  token_merge: 2x2 patch merge by pixel_shuffle (4 ViT patch tokens -> 1 LLM token, channels concatenated 1024 -> 4096); 4x token reduction
  tokens_per_image: |
    256 per 448x448 tile: num_image_token = int((448 // 14) ** 2 * (0.5 ** 2)) = 256 (modeling_internvl_chat.py:52).
    Per image: 256 * num_tiles, where num_tiles = n_grid_tiles + (1 thumbnail if n_grid_tiles > 1). With the README defaults (max_num=12, use_thumbnail=True): 256 (single tile) up to 13 * 256 = 3328.
    In the prompt each '<image>' becomes '<img>' + '<IMG_CONTEXT>' * 256 * num_tiles + '</img>' (line 284): one <img>...</img> pair per image, not per tile, no separators between tiles. Token ids (added_tokens.json): <img> 151665, </img> 151666, <IMG_CONTEXT> 151667.
  token_to_region: |
    Within a tile (from extract_feature + pixel_shuffle, ps_version v2, modeling_internvl_chat.py:168-202): CLS dropped, ViT tokens reshaped row-major to (tiles, 32, 32, 1024), pixel-shuffled to (tiles, 16, 16, 4096) with (row, col) order restored by the final permute, then flattened row-major. Token k (0..255) of a tile: row i = k // 16, col j = k % 16, covering tile pixels x in [28j, 28j+28), y in [28i, 28i+28).
    Across tiles: the n-th <IMG_CONTEXT> of an image maps to tile t = n // 256, k = n % 256 (vit_embeds.reshape(-1, C) written in order, line 334). Tile order = order along pixel_values dim 0.
    Tile -> original image, per the README dynamic_preprocess (lines 295-331): a grid (cols, rows) = target_aspect_ratio is chosen as the aspect ratio closest to the image among all (i, j) with min_num <= i*j <= max_num; the image is resized to (448*cols, 448*rows) WITHOUT preserving aspect ratio; tile i is the crop at column i % cols, row i // cols (row-major); so tile pixel (x, y) of tile i maps to original x_orig = (448*(i % cols) + x) * W / (448*cols), y_orig = (448*(i // cols) + y) * H / (448*rows).
    The thumbnail, when present, is the LAST tile and is the whole image resized to 448x448 (x_orig = x * W / 448, y_orig = y * H / 448). So with tiling every image region is represented twice (once in a grid tile, once in the thumbnail).
multi_view:
  default: |
    Dynamic tiling + thumbnail, done by the caller. config.json: dynamic_image_size true, min_dynamic_patch 1, max_dynamic_patch 12, use_thumbnail true, force_image_size 448 - but the shipped modeling code never reads these flags; it consumes pixel_values of shape (total_tiles, 3, 448, 448) plus num_patches_list.
    Official preprocessing, quoted from README.md:295-339:
      def dynamic_preprocess(image, min_num=1, max_num=12, image_size=448, use_thumbnail=False):
          ...
          target_width = image_size * target_aspect_ratio[0]
          target_height = image_size * target_aspect_ratio[1]
          blocks = target_aspect_ratio[0] * target_aspect_ratio[1]
          resized_img = image.resize((target_width, target_height))
          ...
          if use_thumbnail and len(processed_images) != 1:
              thumbnail_img = image.resize((image_size, image_size))
              processed_images.append(thumbnail_img)
          return processed_images
      def load_image(image_file, input_size=448, max_num=12):
          image = Image.open(image_file).convert('RGB')
          transform = build_transform(input_size=input_size)
          images = dynamic_preprocess(image, image_size=input_size, use_thumbnail=True, max_num=max_num)
          pixel_values = [transform(image) for image in images]
          pixel_values = torch.stack(pixel_values)
          return pixel_values
    README usage: `pixel_values = load_image('./examples/image1.jpg', max_num=12)` with the comment "# set the max number of tiles in `max_num`" (lines 381-382). So by default an image yields 1..12 grid tiles plus one thumbnail when more than one tile.
    Multi-image: concatenate pixel_values and pass num_patches_list (one '<image>' per image, e.g. 'Image-1: <image>\nImage-2: <image>\n...', README:423-438). The README video example uses max_num=1 per frame (lines 470, 489).
  force_single_view: |
    Call the README's load_image(path, max_num=1): target_ratios then contains only (1, 1), so dynamic_preprocess returns exactly one tile (the whole image resized to 448x448, aspect ratio not preserved) and no thumbnail because of `if use_thumbnail and len(processed_images) != 1` (README:328). Result: pixel_values shape (1, 3, 448, 448) -> exactly 256 <IMG_CONTEXT> tokens per image.
    Equivalent at the model interface: one 448x448 tensor per image and num_patches_list=[1]*num_images (single image: chat() defaults num_patches_list to [pixel_values.shape[0]], modeling_internvl_chat.py:260-261).
