loader:
  model_class: 'AutoModel (config.json auto_map -> modeling_internvl_chat.InternVLChatModel; architectures: InternVLChatModel; model_type internvl_chat)'
  processor_class: |
    No processor class. Tokenizer: tokenizer_config.json tokenizer_class Qwen2Tokenizer (README loads AutoTokenizer with trust_remote_code=True, use_fast=False). Image preprocessing is done by the caller with the README's build_transform / dynamic_preprocess / load_image (README.md:267-339).
    preprocessor_config.json exists (feature_extractor_type CLIPFeatureExtractor, size 448, crop_size 448, do_center_crop true, resample 3, ImageNet mean/std) but the shipped remote code never reads it, and it does NOT match the official README transform (plain Resize((448,448)), no center crop).
  trust_remote_code: true
  config_transformers_version: 4.48.3
  notes: |
    - config.json top-level transformers_version is null (line 116); "4.48.3" is recorded inside llm_config (line 99), vision_config (line 215) and generation_config.json.
    - README requirement (line 176): "Please use transformers>=4.37.2 to ensure the model works normally." The remote code asserts transformers >= 4.37.0 (modeling_internvl_chat.py:46).
    - auto_map entries are local (no "repo--" prefix): AutoConfig -> configuration_internvl_chat.InternVLChatConfig, AutoModel / AutoModelForCausalLM -> modeling_internvl_chat.InternVLChatModel (config.json lines 7-11), so the .py files in the model dir are used. (The SenseNova-SI derivatives have repo-prefixed auto_map instead.)
    - The five remote-code files are byte-identical (md5) between InternVL3-8B, InternVL3-2B and the local SenseNova-SI-1.2-InternVL3-8B directory.
    - README loading call (lines 186-191): AutoModel.from_pretrained(path, torch_dtype=torch.bfloat16, low_cpu_mem_usage=True, use_flash_attn=True, trust_remote_code=True).
    - Attention backend: InternVLChatModel.__init__ sets `config.llm_config._attn_implementation = 'flash_attention_2' if use_flash_attn else 'eager'` with `use_flash_attn = use_flash_attn if has_flash_attn else False` and default use_flash_attn=True (modeling_internvl_chat.py:43, 55-57). For attention weights pass use_flash_attn=False to from_pretrained (the code then selects 'eager'); attn_implementation alone is overwritten. llm_config in this config.json has no attn_implementation key (only _attn_implementation_autoset: true).
    - Remote code supports only LlamaForCausalLM / Qwen2ForCausalLM (lines 68-73) and needs einops and timm (modeling_intern_vit.py:12-13); flash_attn optional (lines 23-30).
    - README says InternVL3 integrates Variable Visual Position Encoding (V2PE) (line 62), but the shipped modeling_internvl_chat.py contains no V2PE logic: chat()/generate() pass no position_ids and forward() only forwards a caller-supplied position_ids (lines 94, 134, 340-347). Inference with this code uses ordinary integer positions.
    - Generation: chat() takes a generation_config dict; README uses dict(max_new_tokens=1024, do_sample=True) (line 383). Pass do_sample=False for greedy decoding. generation_config.json has only _from_model_config and the version.
    - Whether this 4.48-era remote code runs under transformers 5.24.1 was not tested (no code from the model dir was imported, no weights loaded).
