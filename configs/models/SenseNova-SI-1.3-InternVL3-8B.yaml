base_model: |
  OpenGVLab/InternVL3-8B - from README.md front matter lines 2-3: `base_model:` / `- OpenGVLab/InternVL3-8B`.
  The README body does not name the base checkpoint in a sentence; the closest statements are: "we explore scaling up multimodal foundation models to cultivate spatial intelligence within the **SenseNova-SI family**, built upon established multimodal foundations including visual understanding models (i.e., Qwen3-VL and InternVL3) and unified understanding and generation models (i.e., Bagel)." and "Currently, we build SenseNova-SI upon popular open-source foundation models to maximize compatibility with existing research pipelines." The example commands also show `# --model_path OpenGVLab/InternVL3-8B` as a commented alternative.
  No variant suffix (e.g. -Instruct / -Pretrained) is given anywhere in the card.
  Release statement in this card (lines 40-46): "In this release, we present SenseNova-SI-1.3-InternVL3-8B, SenseNova-SI-1.2-InternVL3-8B, SenseNova-SI-1.1-Qwen2.5-VL-3B, SenseNova-SI-1.1-Qwen2.5-VL-7B, and SenseNova-SI-1.1-Qwen3-VL-8B, of which SenseNova-SI-1.3-InternVL3-8B achieve state-of-the-art performance among open-source models of comparable size across eight recent spatial intelligence benchmarks: VSI, MMSI, MindCube, ViewSpatial, SITE, BLINK, 3DSRBench, EmbSpatial-Bench. It also improves open-ended spatial question-answering capabilities compared to previous versions."
  Stated difference to 1.2: only that last sentence (improved open-ended spatial QA) plus the scores. Card-reported scores for 1.3 (VSI / MMSI / MindCube-Tiny / ViewSpatial / SITE / BLINK / 3DSRBench / EmbSpatial-Bench): 68.6 / 42.5 / 89.9 / 61.3 / 47.5 / 68.0 / 62.4 / 81.0; the 1.2 card reports 69.6 / 42.6 / 89.0 / 58.8 / 49.0 / 69.4 / 60.1 / 77.7. Architecture: config.json of 1.2 and 1.3 differ only in the repo name strings (_name_or_path, auto_map prefixes); the remote code files are byte-identical.
