loader:
  model_class: 'AutoModel (config.json auto_map -> "sensenova/SenseNova-SI-1.3-InternVL3-8B--modeling_internvl_chat.InternVLChatModel"; architectures: InternVLChatModel)'
  processor_class: |
    No processor class. Tokenizer: tokenizer_config.json tokenizer_class Qwen2Tokenizer (tokenizer.json present). Image preprocessing is done by the caller; the model card contains no preprocessing code (it delegates to example.py of the GitHub repo OpenSenseNova/SenseNova-SI, which is not in this directory).
    preprocessor_config.json is present: feature_extractor_type CLIPFeatureExtractor, size 448, crop_size 448, do_center_crop true, resample 3, ImageNet mean [0.485, 0.456, 0.406] / std [0.229, 0.224, 0.225]. The remote modeling code does not read it.
  trust_remote_code: true
  config_transformers_version: 4.47.1
  notes: |
    - config.json top-level `transformers_version` is null (line 117); "4.47.1" is the value recorded inside llm_config (line 100), vision_config (line 216) and generation_config.json.
    - No transformers version pin appears in README.md / README_CN.md. Installation is described only as `git clone git@github.com:OpenSenseNova/SenseNova-SI.git; uv sync --extra cu124; uv sync` (the pinned versions live in that repo's lock file, not here). The remote code asserts transformers >= 4.37.0 (modeling_internvl_chat.py:46).
    - Usage in the card is only via `python example.py --image_paths ... --question ... --model_path sensenova/SenseNova-SI-1.3-InternVL3-8B` (example.py is not shipped here).
    - auto_map entries are repo-prefixed ("sensenova/SenseNova-SI-1.3-InternVL3-8B--configuration_internvl_chat.InternVLChatConfig" etc., config.json lines 7-11). In transformers 5.5.4, get_class_from_dynamic_module takes the repo id from the part before "--" (dynamic_module_utils.py:563-566) and fetches the module from that repo, so loading this local directory with AutoModel/AutoConfig may try to resolve the code from the Hub / HF cache instead of the .py files in the directory. Not tested.
    - Remote code supports only LlamaForCausalLM / Qwen2ForCausalLM LLMs (modeling_internvl_chat.py:68-73) and needs `einops` and `timm` (modeling_intern_vit.py:12-13); flash_attn is optional (try/except, lines 23-30).
    - Attention weights: llm_config contains "attn_implementation": "flash_attention_2" (config.json line 25) and "_attn_implementation_autoset": true. Independently of that key, InternVLChatModel.__init__ overwrites it: `config.llm_config._attn_implementation = 'flash_attention_2' if use_flash_attn else 'eager'` (modeling_internvl_chat.py:57), with `use_flash_attn = use_flash_attn if has_flash_attn else False` (line 55) and the __init__ default use_flash_attn=True (line 43). Therefore passing attn_implementation="eager" alone is not sufficient if flash_attn is installed; pass `use_flash_attn=False` to from_pretrained (then the code itself selects 'eager'), or build without the flash_attn package. flash / sdpa backends do not return attention weights.
    - Vision side: vision_config.use_flash_attn true in config.json, but __init__ resets it from the same flag (line 56).
    - The remote code is byte-identical across the three local SenseNova-SI InternVL3 directories (same md5 for modeling_internvl_chat.py, modeling_intern_vit.py, configuration_*.py, conversation.py); conversation.py is also identical to the one in InternVL3_5-8B.
    - config.json line 2 has "_commit_hash": null.
