thinking:
  has_thinking_mode: true
  how_to_disable: >-
    Thinking is ON by default. chat_template.jinja:149-153: when the template variable
    enable_thinking is defined and false the generation prompt ends with an empty block
    '<think>\n\n</think>\n\n'; otherwise it ends with an open '<think>\n'. To disable, set
    enable_thinking=False as a chat-template variable. README:764 states the model thinks by
    default; README:799 shows the serving form "chat_template_kwargs": {"enable_thinking": False}.
    README:762: the /think and /nothink soft switches are not officially supported.
    preserve_thinking (default off, chat_template.jinja:100) only affects how earlier assistant
    turns are rendered.
  source: "chat_template.jinja:149-153; README.md:764, 799, 762"
