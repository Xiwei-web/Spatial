thinking:
  has_thinking_mode: true
  how_to_disable: >-
    apply_chat_template(..., enable_thinking=False)，这也是模板默认值（chat_template.jinja:186 `enable_thinking | default(false)`）。
    关闭时模板不在 system turn 写 <|think|>，并在 generation prompt 的 `<|turn>model\n` 后预填空思考块
    `<|channel>thought\n<channel|>`（:383-385）。开启时在第一个 system turn 顶部注入 `<|think|>\n`（:193-194）。
    README.md:374 原文："Thinking is enabled by including the `<|think|>` token at the start of the system prompt. To disable thinking, remove the token."
    README.md:377："For all models except for the E2B and E4B variants, if thinking is disabled, the model will still generate the tags but with an empty thought block"。
    README 的纯文本示例显式传 enable_thinking=False（:165），图像示例没有传该参数（即取模板默认 false）。
  source: "README.md:165,177,370-378；chat_template.jinja:186,193-194,383-385"
