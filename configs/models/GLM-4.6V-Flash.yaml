thinking:
  has_thinking_mode: true
  how_to_disable: >-
    apply_chat_template(..., enable_thinking=False)。模板行为（chat_template.jinja）：当 enable_thinking 已定义且为假时，
    在每条 user 消息末尾追加 `/nothink`（:61，若内容已以 /nothink 结尾则不重复），
    并在 generation prompt 的 `<|assistant|>` 换行后预填 `<think></think>\n`（:138-139）。
    不传 enable_thinking 时两处都不触发，即默认不关闭思考。历史 assistant 消息统一写成 `<think></think>` 或带 reasoning_content 的 `<think>...</think>`（:74-78）。
    README 未说明思考开关，只提到模型“may still overthink or even repeat itself”（README.md:139）。
  source: "chat_template.jinja:61,74-78,138-139；README.md:134-139"
