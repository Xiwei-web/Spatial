    - full_attention   # 34
    - full_attention   # 35
    - full_attention   # 36
    - full_attention   # 37
    - full_attention   # 38
    - full_attention   # 39
  mixer_details: >-
    config 中没有 layer_types / sliding_window 字段；Glm4vTextModel.forward 只构造一个 create_causal_mask
    并用于全部层（modeling_glm4v.py:903），所有 40 层都是标准因果 softmax 自注意力（Glm4vTextAttention :510-577，is_causal=True）。
    GQA：32 个 q 头、num_key_value_heads=2，即每 16 个 q 头共享一组 K/V（num_key_value_groups = 32 // 2，:525）。
    q/k/v_proj 带 bias（attention_bias=true），o_proj 无 bias。
    位置编码为 3D M-RoPE：mrope_section=[8,12,12]（时间/高/宽），rope_theta=500000，partial_rotary_factor=0.5；
    图像 token 的 (t,h,w) 位置由 get_vision_position_ids 生成（:949-1003）。
  mlp_type: "dense（Glm4vTextMLP，intermediate_size=13696，hidden_act silu；本模型不是 glm4v_moe）"
  head_level_analysis: >-
    40 层都可做 head 级分析与注意力屏蔽（全局因果 softmax 注意力，o_proj 输入为 32 头 x 128 维拼接）。
    注意 K/V 只有 2 组：同组 16 个头共用同一份 K 和 V，头之间只有 Q（及 o_proj 切片）不同，
    对 K/V 的干预无法做到单头粒度。attn_weights 的返回取决于注意力后端（:560-573 通过 ALL_ATTENTION_FUNCTIONS 选择，
    缺省回落 eager_attention_forward）；非 eager 后端是否返回权重未核实。
vision_encoder:
  type: "Glm4vVisionModel (model_type glm4v_vision)"
  num_layers: 24          # vision_config.depth
  hidden_size: 1536       # num_heads 12，out_hidden_size 4096
  patch_size: 14          # temporal_patch_size 2（Conv3d patch embed，modeling_glm4v.py:91-92）
  resolution_strategy: >-
    dynamic（原生分辨率，单视图）。Glm46VImageProcessor 用 smart_resize（image_processing_glm46v.py:50-83, :152-161）：
    高宽各自四舍五入到 28（=patch_size*merge_size）的倍数；单张图按 num_frames=temporal_patch_size=2 计入，
    若 2*H'*W' > max_pixels 则等比缩小，若 2*H'*W' < min_pixels 则等比放大；长宽比上限 200。
    本模型 preprocessor_config.json：size.shortest_edge=12544（min_pixels），size.longest_edge=9633792（max_pixels）。
    由此推出（未实测）单图 H'*W' 上限 4816896 像素、下限 6272 像素。
    单张图在送入 Conv3d 前被复制成 2 帧（:184-188），grid_t=1。归一化用 CLIP mean/std。
    vision_config.image_size=336 只决定可学习位置表的大小（24x24），不是输入分辨率。
  position_encoding: >-
    两种叠加：(1) 可学习绝对位置表 nn.Embedding((336/14)^2=576, hidden)，视作 24x24 网格，
    按各 patch 的归一化坐标用 F.grid_sample（bicubic, align_corners=False, padding_mode border）插值到实际网格后相加
    （Glm4vVisionEmbeddings，modeling_glm4v.py:136-207）；(2) 每个视觉注意力层内的 2D RoPE（h、w 位置，
    Glm4vVisionRotaryEmbedding(head_dim//2)，rot_pos_emb :711, :730-757）。
connector:
  type: "post_layernorm → Conv2d downsample（kernel=stride=spatial_merge_size=2，1536→4096）→ Glm4vVisionPatchMerger（Linear+LayerNorm+GELU 后接门控 MLP，输出 4096 维）（modeling_glm4v.py:119-133, :714-724, :806-814）"
  token_merge: "2x2 空间合并（4 个 14px patch → 1 个 token，4 倍压缩）；另有时间方向 2 帧合 1（单图为同一帧复制）"
  tokens_per_image: >-
    可变：n = grid_t*grid_h*grid_w / merge_size^2 = (H'/28) * (W'/28)，H'、W' 为 smart_resize 后的高宽
    （processing_glm46v.py:115-120；image_processing_glm46v.py:190-192）。
    按 preprocessor_config 的像素范围推算（未实测）：最少 8 个、最多 6144 个 token。
    模板把每张图写成 <|begin_of_image|><|image|><|end_of_image|>，processor 把 <|image|> 展开成 n 个。
  token_to_region: >-
    可行，规则确定。图像处理器把 patch 按“合并后网格行优先、每个 2x2 块内 4 个 patch 相邻”的顺序排列
    （permute 为 (B, grid_t, gh, gw, mh, mw, ...)，image_processing_glm46v.py:194-213），
    视觉塔末端每 4 个相邻 patch 经 Conv2d 合成 1 个 token（modeling_glm4v.py:808-812），
    LLM 侧位置 id 也是高度 repeat_interleave、宽度 repeat（:993-998），即行优先。
    第 i 个图像 token ↔ row = i // (W'/28), col = i % (W'/28)，对应缩放后图像上的 28x28 像素格
    [col*28, (col+1)*28) x [row*28, (row+1)*28)；再按 (原宽/W', 原高/H') 映回原图。
    每个 token 经过 24 层视觉注意力，内容上会混入其他位置的信息。
multi_view:
  default: "否。Glm46VImageProcessor 只做一次 smart_resize，没有切片、多裁剪或缩略图；每张图恒为单视图，token 数随分辨率变化。"
  force_single_view: "无需设置（本来就是单视图）。要固定 token 数：把输入图预先缩放到固定的 28 倍数尺寸，或通过 images_kwargs 的 size={shortest_edge, longest_edge}（即 min/max pixels）收紧范围。"
