  config_transformers_version: "5.0.0rc0"
  notes: >-
    README.md:74 `pip install transformers>=5.0.0rc0`（写在 vLLM 安装段，另有 vllm>=0.12.0、sglang>=0.5.6.post1）。
    注意 config.json 的 model_type=glm4v / architectures=Glm4vForConditionalGeneration，
    而 preprocessor_config.json 指定 Glm46VImageProcessor / Glm46VProcessor（video 为 Glm46VVideoProcessor）：模型类与处理器类分属两个模块。
    tokenizer_config.json 的 tokenizer_class=PreTrainedTokenizer。
    README 示例在 generate 前 `inputs.pop("token_type_ids", None)`（README.md:112），torch_dtype="auto", device_map="auto"。
    generation_config.json（transformers_version 4.57.1）：do_sample=true, top_p=0.6, top_k=2, temperature=0.8；README 另建议 repetition_penalty=1.1。
language_model:
  model_type: glm4v_text
  num_layers: 40
  hidden_size: 4096
  num_attention_heads: 32
  num_key_value_heads: 2
  head_dim: 128               # hidden_size // num_attention_heads（modeling_glm4v.py:523），config 中无 head_dim 字段
  layer_mixers:
    - full_attention   # 0
    - full_attention   # 1
    - full_attention   # 2
