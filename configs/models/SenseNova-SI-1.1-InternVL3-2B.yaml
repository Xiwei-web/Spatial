    Not stated. README.md, README_CN.md and examples/ (PNG images only) contain no grounding / bounding-box prompt, no <ref>/<box> usage and no coordinate convention. The tokenizer does define <ref> </ref> <box> </box> <quad> </quad> (added_tokens.json ids 151668-151673), inherited vocabulary only.
    Spatial QA prompt format as shown in the card (examples only, no formal spec):
    - Multi-image questions put the placeholders at the start of the question: `--question "<image><image>\nYou are standing in front of the dice pattern and observing it. Where is the desk lamp approximately located relative to you?\nOptions: A: 90 degrees counterclockwise, B: 90 degrees clockwise, C: 135 degrees counterclockwise, D: 135 degrees clockwise"` with `--image_paths examples/Q1_1.png examples/Q1_2.png` (GT: C).
    - Second example: `"<image><image>\nBased on these two views showing the same scene: in which direction did I move from the first view to the second view?\nA. Directly left B. Directly right C. Diagonally forward and right D. Diagonally forward and left"` (GT: D).
    - Multiple-choice with lettered options; no answer-format suffix is used in these two examples. For jsonl batches the card points to the InternVL chat data format docs (single-image / multi-image data).
    - For benchmark reproduction the card refers to EASI (no prompt templates given locally).
