  mixer_details: |
    All 28 layers are standard causal full self-attention with grouped-query attention (12 query heads, 2 KV heads).
    head_dim 128 is computed, not stated: config.json llm_config has no head_dim key; transformers Qwen2Attention uses getattr(config, "head_dim", hidden_size // num_attention_heads) = 1536 // 12 = 128 (models/qwen2/modeling_qwen2.py:195, transformers 5.5.4).
    No sliding window is active: llm_config has use_sliding_window: false and sliding_window: null (max_window_layers: 70 > 28 layers and inert). In transformers 5.5.4 Qwen2Config.__post_init__ sets sliding_window=None when use_sliding_window is false and builds layer_types as all "full_attention" (models/qwen2/configuration_qwen2.py:84-94).
    rope_scaling in llm_config: {factor: 2.0, rope_type: dynamic, type: dynamic}, rope_theta 1000000.0.
    llm_config._name_or_path is "./pretrained/Qwen2.5-32B-Instruct", which does not match the dimensions (hidden 1536, 28 layers) - treat it as a stale path string, not as the LLM identity.
  mlp_type: dense (architectures = Qwen2ForCausalLM; hidden_act silu, intermediate_size 8960; llm_config.moe_config is null)
  head_level_analysis: |
    All 28 layers have the same structure (12 heads), so head-level analysis is structurally possible on every layer.
    Precondition: eager attention in the LLM. config.json asks for flash_attention_2 and the remote code re-forces it when use_flash_attn=True and flash_attn is importable (modeling_internvl_chat.py:55-57); load with use_flash_attn=False so the code sets 'eager'. In transformers 5.5.4 only eager_attention_forward returns the softmaxed weights (models/qwen2/modeling_qwen2.py:161-183) and config.output_attentions raises unless _attn_implementation is 'eager' (configuration_utils.py:346-351).
    InternVLChatModel.forward passes output_attentions to the language model and returns outputs.attentions (modeling_internvl_chat.py:137,165).
    Head masking is not offered by an argument in the code read; it would need hooks. Not tested (no weights were loaded).
    Vision encoder: InternAttention never returns attention weights (_naive_attn returns only x; FlashAttention asserts not need_weights), so ViT attention needs hooks / re-computation.
vision_encoder:
  type: |
    InternVisionModel from the shipped modeling_intern_vit.py. config.json vision_config.model_type is "intern_vit_6b" and vision_config._name_or_path is "OpenGVLab/InternViT-6B-448px-V1-5", but the actual dimensions are hidden_size 1024, 24 layers, 16 heads, intermediate_size 4096, norm_type layer_norm, qkv_bias true (i.e. not 6B-sized; the two strings contradict the numbers).
    The README does not name the vision encoder. vision_config also carries MoE-related keys (num_experts 8, use_moe false, ...) that the shipped modeling_intern_vit.py does not read.
  num_layers: 24
  hidden_size: 1024
  patch_size: 14
  resolution_strategy: |
    Encoder input is fixed 448x448 per tile (vision_config.image_size 448, force_image_size 448) -> 32x32 = 1024 patch tokens + 1 CLS.
    Higher resolution is handled outside the encoder by dynamic tiling: config dynamic_image_size true, min_dynamic_patch 1, max_dynamic_patch 12, use_thumbnail true (see multi_view).
  position_encoding: |
    Learned absolute position embedding: nn.Parameter of shape (1, 1025, 1024) = CLS + 32x32 (modeling_intern_vit.py:149-152).
    At forward time the patch part goes through _get_pos_embed, which bicubic-interpolates (F.interpolate, mode='bicubic', align_corners=False) the 32x32 grid to the actual (H, W) patch grid (lines 154-173); at 448x448 input this is the identity size. No rotary / 2D relative encoding in the ViT.
connector:
  type: |
    pixel_shuffle (space-to-depth, downsample_ratio 0.5, ps_version v2) followed by `mlp1` = Sequential(LayerNorm(4096), Linear(4096, 1536), GELU(), Linear(1536, 1536)) (modeling_internvl_chat.py:78-83; 4096 = vit_hidden 1024 * int(1/0.5)^2; llm hidden 1536). Uses the last ViT layer (select_layer -1), CLS token dropped.
  token_merge: 2x2 patch merge by pixel_shuffle (4 ViT patch tokens -> 1 LLM token, channels concatenated 1024 -> 4096); 4x token reduction
  tokens_per_image: |
    256 per 448x448 tile: num_image_token = int((448 // 14) ** 2 * (0.5 ** 2)) = int(1024 * 0.25) = 256 (modeling_internvl_chat.py:52).
    Per image: 256 * num_tiles. In the prompt each image becomes '<img>' + '<IMG_CONTEXT>' * 256 * num_tiles + '</img>' (modeling_internvl_chat.py:284), i.e. one <img>...</img> pair per image, not per tile.
    Token ids (added_tokens.json): <img> 151665, </img> 151666, <IMG_CONTEXT> 151667.
  token_to_region: |
    Derived from the shipped remote code (extract_feature + pixel_shuffle, ps_version=v2), not from a doc statement.
    1) The ViT output drops the CLS token (vit_embeds[:, 1:, :]) and is reshaped to (tiles, 32, 32, 1024), row-major: dim1 = patch row (y), dim2 = patch column (x).
    2) pixel_shuffle(scale_factor=0.5): view -> merges horizontally adjacent patch pairs into channels; permute(0,2,1,3); view -> merges vertically adjacent pairs; for ps_version != 'v1' a final permute(0,2,1,3) restores (row, col) order. Result (tiles, 16, 16, 4096).
    3) reshape(tiles, -1, 4096) flattens row-major, so within one 448x448 tile, token k (0..255) has row i = k // 16, col j = k % 16 and covers ViT patches rows 2i..2i+1, cols 2j..2j+1, i.e. tile pixels x in [28*j, 28*j+28), y in [28*i, 28*i+28).
       Channel concat order inside a token: patch(2i,2j), patch(2i,2j+1), patch(2i+1,2j), patch(2i+1,2j+1).
    4) Across tiles: the n-th <IMG_CONTEXT> position of an image (n counted from 0) maps to tile t = n // 256, k = n % 256, because vit_embeds.reshape(-1, C) is written into the IMG_CONTEXT positions in order. Tile order = order of pixel_values along dim 0 (see multi_view).
    5) Tile pixel -> original image pixel depends on the caller's preprocessing (tile grid cols x rows, each tile is a crop of the image resized to (448*cols, 448*rows) without keeping aspect ratio; the thumbnail is the whole image resized to 448x448).
multi_view:
  default: |
    config.json: dynamic_image_size true, min_dynamic_patch 1, max_dynamic_patch 12, use_thumbnail true, force_image_size 448.
    IMPORTANT: the shipped modeling_internvl_chat.py never reads these four flags; tiling is done by the caller, and the model consumes pixel_values of shape (total_tiles, 3, 448, 448) plus num_patches_list. The model card (README.md / README_CN.md) contains NO preprocessing code (no dynamic_preprocess / load_image / max_num); it only calls `python example.py` from the GitHub repo, which is not in this directory. So the tiling actually used by the authors (max_num, thumbnail) is not verifiable from local files.
    What the modeling code fixes regardless of the preprocessing: tiles are consumed in the order of pixel_values along dim 0; all tiles of one image share one <img> ... </img> span with 256*num_tiles <IMG_CONTEXT> tokens; for several images, num_patches_list gives tiles per image and each '<image>' placeholder is replaced in order (modeling_internvl_chat.py:283-285). If '<image>' is absent from the question, chat() prepends a single '<image>\n' (line 257-258).
    For reference only: the standard InternVL tiling function printed in the local InternVL3_5-8B README (dynamic_preprocess: row-major tile order, tile i at column i % cols and row i // cols, thumbnail appended last and only when more than one tile) is the same family's convention, but this card does not state that SenseNova-SI uses it.
  force_single_view: |
    From the modeling code: give exactly one 448x448 tensor per image, i.e. pixel_values of shape (num_images, 3, 448, 448) and num_patches_list=[1]*num_images (single image: chat() defaults num_patches_list to [pixel_values.shape[0]] = [1], modeling_internvl_chat.py:260-261). Each image then occupies exactly 256 <IMG_CONTEXT> tokens and no thumbnail exists.
    How to obtain that through the authors' example.py (e.g. a max_num argument) is not stated in the local card. With the InternVL-family dynamic_preprocess (InternVL3_5-8B README), max_num=1 yields one tile and no thumbnail because of `if use_thumbnail and len(processed_images) != 1:`.
